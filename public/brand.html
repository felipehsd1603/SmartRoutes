<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marca — SDM Links</title>
<link rel="stylesheet" href="/a11y.css">
<script src="/a11y.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Archivo+Black&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{trueBlue:'#0065FC',retroBlue:'#003B8B',polem:'#EDE6B6',retroGrey:'#1a1a1a',infrared:'#FF3B30',offWhite:'#f5f5f2'},fontFamily:{sans:['Archivo','sans-serif'],display:['"Archivo Black"','sans-serif'],serif:['"Libre Caslon Display"','serif']}}}}</script>
<style>body{font-family:Archivo,sans-serif;background:#f5f5f2;color:#1a1a1a}</style>
</head>
<body>
<header class="bg-retroGrey text-white py-4"><div class="max-w-[1400px] mx-auto px-4 lg:px-8 flex items-center justify-between"><a href="/" class="font-display text-2xl uppercase tracking-tight">SDM Links</a><a href="/" class="text-sm font-black uppercase tracking-widest hover:text-polem">← Voltar</a></div></header>

<section class="bg-trueBlue text-white py-16">
  <div class="max-w-[1400px] mx-auto px-4 lg:px-8">
    <span class="inline-block bg-polem text-retroGrey text-xs font-black uppercase tracking-widest px-3 py-1 mb-4">Marca</span>
    <h1 id="brandTitle" class="text-5xl sm:text-6xl lg:text-8xl font-display uppercase tracking-tighter leading-[0.85]">—</h1>
    <p id="brandCount" class="mt-4 text-white/70 text-sm uppercase tracking-widest font-black">Carregando…</p>
  </div>
</section>

<section class="py-12 lg:py-20">
  <div class="max-w-[1400px] mx-auto px-4 lg:px-8">
    <div id="brandGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5" aria-live="polite" aria-busy="true"></div>
  </div>
</section>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => c != null ? (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '';
async function load(){
  const slug = location.pathname.split('/').pop();
  document.getElementById('brandTitle').textContent = slug.charAt(0).toUpperCase() + slug.slice(1);
  document.title = `${slug.charAt(0).toUpperCase() + slug.slice(1)} — SDM Links`;
  try {
    const res = await fetch(`/api/brand/${encodeURIComponent(slug)}`);
    const { data } = await res.json();
    document.getElementById('brandCount').textContent = `${data.length} ${data.length === 1 ? 'produto' : 'produtos'} cadastrados`;
    const grid = document.getElementById('brandGrid');
    grid.setAttribute('aria-busy','false');
    if (!data.length) { grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">Ainda não temos produtos dessa marca. Volta logo.</p>'; return; }
    grid.innerHTML = data.map(p => `
      <a href="/post/${esc(p.slug)}" class="group bg-white rounded-2xl overflow-hidden hover:shadow-xl transition-all">
        <div class="aspect-square bg-gray-100 overflow-hidden">
          ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">` : `<div class="w-full h-full flex items-center justify-center text-xl font-black uppercase text-gray-300">${esc(p.brand || 'SDM')}</div>`}
        </div>
        <div class="p-4">
          <p class="text-[10px] font-black uppercase tracking-widest text-trueBlue mb-1">${esc(p.category || '')}</p>
          <h3 class="font-black text-sm uppercase leading-tight line-clamp-2">${esc(p.title)}</h3>
          ${p.price_cents ? `<p class="text-sm font-black text-trueBlue mt-2">${money(p.price_cents)}</p>` : ''}
        </div>
      </a>`).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('brandGrid').innerHTML = '<p class="col-span-full text-center text-red-500 py-12">Erro ao carregar.</p>';
  }
}
load();
</script>
</body>
</html>
