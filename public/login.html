<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — SDM Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Archivo', 'sans-serif'],
                        display: ['"Archivo Black"', 'Archivo', 'sans-serif'],
                        serif: ['"Libre Caslon Display"', 'serif']
                    },
                    colors: {
                        retroBlue: '#003F9E',
                        trueBlue: '#0065FC',
                        uncBlue: '#00AAFF',
                        starfish: '#FF6600',
                        polem: '#FFC600',
                        infrared: '#FF002A',
                        darkMocha: '#4C3A30',
                        retroGrey: '#2E2E2E',
                        offWhite: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        :focus-visible {
            outline: 3px solid #FFC600;
            outline-offset: 3px;
            border-radius: 4px;
        }
        .bg-white :focus-visible {
            outline-color: #0065FC;
        }
    </style>
</head>
<body class="bg-trueBlue min-h-screen flex items-center justify-center font-sans p-4">
    <main class="w-full max-w-md" aria-labelledby="login-heading">
        <div class="flex flex-col items-center mb-8">
            <svg viewBox="0 0 200 200" class="w-20 h-20 mb-4" role="img" aria-hidden="true" focusable="false">
                <circle cx="100" cy="100" r="100" fill="white"/>
                <text x="100" y="132" text-anchor="middle" font-family="'Archivo Black', Archivo, sans-serif" font-weight="900" font-size="78" fill="#0065FC" letter-spacing="-4">SDM</text>
            </svg>
            <h1 id="login-heading" class="font-black text-white uppercase text-2xl tracking-tight"><span class="font-serif italic lowercase tracking-normal">Links</span> · Admin</h1>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-2xl">
            <h2 class="font-black text-xl uppercase tracking-tight mb-1">Entrar</h2>
            <p class="text-sm text-gray-500 mb-6">Acesso restrito aos editores.</p>

            <div id="error" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4 hidden" role="alert" aria-live="polite">Credenciais inválidas.</div>

            <form id="loginForm" class="space-y-4" novalidate>
                <div>
                    <label for="username" class="block text-xs font-black uppercase tracking-widest text-gray-700 mb-2">Usuário</label>
                    <input type="text" id="username" name="username" autocomplete="username" aria-describedby="error" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-trueBlue transition-colors" required>
                </div>
                <div>
                    <label for="password" class="block text-xs font-black uppercase tracking-widest text-gray-700 mb-2">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="error" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-trueBlue transition-colors" required>
                </div>
                <button type="submit" class="w-full bg-trueBlue hover:bg-retroBlue text-white font-black uppercase tracking-wide text-sm py-4 rounded-full transition-colors">Entrar</button>
            </form>
        </div>

        <p class="text-center text-xs text-white/70 mt-6 uppercase tracking-widest font-bold">O maior canal de sneakers do Brasil</p>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/admin';
                } else {
                    const data = await res.json();
                    console.error('Erro no login:', data.error);
                    errorDiv.classList.remove('hidden');
                    errorDiv.focus?.();
                }
            } catch (err) {
                console.error('Erro de rede:', err);
                errorDiv.innerText = 'Erro de conexão com o servidor.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
