<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SDM Smeaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#000000', secondary: '#ffffff', accent: '#ff0000' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], oswald: ['Oswald', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-black text-white p-4 flex justify-between items-center">
        <h1 class="font-oswald text-xl font-bold uppercase">SDM Smeaker Admin</h1>
        <div>
            <a href="/" target="_blank" class="mr-4 text-sm hover:text-gray-300">View Site</a>
            <button id="logoutBtn" class="text-sm bg-red-600 px-3 py-1 rounded hover:bg-red-700 transition-colors">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-8 max-w-5xl">
        <div class="flex gap-8">
            <!-- Form to Add Post -->
            <div class="w-1/3 bg-white p-6 rounded shadow-md h-fit">
                <h2 class="text-xl font-oswald font-bold mb-4">Add New Post</h2>
                <form id="postForm" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" name="title" id="title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-black focus:border-black sm:text-sm" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Category</label>
                        <select name="category" id="category" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-black focus:border-black sm:text-sm">
                            <option value="News">News</option>
                            <option value="Release Dates">Release Dates</option>
                            <option value="Manoel Gomes">Manoel Gomes</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Image</label>
                        <input type="file" name="image" id="image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-50 file:text-gray-700 hover:file:bg-gray-100" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700">Content</label>
                        <textarea name="content" id="content" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-black focus:border-black sm:text-sm" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-black text-white py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black">Publish Post</button>
                </form>
            </div>

            <!-- List of Posts -->
            <div class="w-2/3 bg-white p-6 rounded shadow-md">
                <h2 class="text-xl font-oswald font-bold mb-4">Manage Posts</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="postsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/admin/logout', { method: 'POST' });
            window.location.href = '/admin/login';
        });

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('image', document.getElementById('image').files[0]);
            formData.append('content', document.getElementById('content').value);

            const res = await fetch('/admin/posts', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                alert('Post published successfully!');
                document.getElementById('postForm').reset();
                loadPosts();
            } else {
                alert('Error publishing post.');
            }
        });

        async function deletePost(id) {
            if(confirm('Are you sure you want to delete this post?')) {
                const res = await fetch(`/admin/posts/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadPosts();
                } else {
                    alert('Error deleting post.');
                }
            }
        }

        async function loadPosts() {
            const res = await fetch('/api/posts');
            const data = await res.json();
            const tbody = document.getElementById('postsTableBody');
            tbody.innerHTML = '';

            if(data.data) {
                data.data.forEach(post => {
                    const date = new Date(post.published_at).toLocaleDateString();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap"><img src="${post.image_url}" class="h-10 w-10 object-cover rounded"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 truncate max-w-xs">${post.title}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${post.category}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="deletePost(${post.id})" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // Load posts on init
        loadPosts();
    </script>
</body>
</html>
